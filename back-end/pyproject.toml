[project]
name = "back-end"
version = "0.1.0"
description = "FastAPI service exposing a User CRUD API"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
    "sqlalchemy==2.0.51",
    "alembic==1.19.1",
    "psycopg[binary]==3.3.4",
    "pydantic[email]==2.13.4",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.16.2",
]
